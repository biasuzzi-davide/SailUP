<!DOCTYPE html>
<html lang="it" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link rel="stylesheet" href="../css/style.css" media="screen">

<body>
    <a href="#main-content" class="skip-to-content">Salta al contenuto principale</a>

    [HEADER]

    <main id="main-content">
        <section class="section-container">
            <div class="auth-card">
                <div>
                    <!-- IL TITOLO è PAGAMENTO CONFERMATO IN CASO DI PAGAMENTO CON CARTA OPPURE PAGAMENTO DA FARE TIPO PER CONTANTI O BONIFICO-->

                <div class="order-summary">
                    <h2>Riepilogo Ordine</h2>
                    <dl>
                        <div>

                            <dd><strong>Sunseeker Predator</strong></dd>
                        </div>
                        <div>
                            <dt><span lang="en">Check-in</span>:</dt>
                            <dd><time datetime="2025-07-15">15 Luglio 2025</time></dd>
                        </div>
                        <div>
                            <dt><span lang="en">Check-out</span>:</dt>
                            <dd><time datetime="2025-07-17">17 Luglio 2025</time></dd>
                        </div>
                        <div>
                            <dt><span lang="en">Skipper</span>:</dt>
                            <dd>Sì <span class="text-accent">(+10%)</span></dd>
                        </div>
                        <div>
                            <dt><strong>Totale Pagato:</strong></dt>
                            <dd><strong class="price-value">€ 1.870</strong></dd>
                        </div>
                    </dl>
                </div>

                <div class="form-actions">
                    <a href="index.html" class="btn-layout">Torna alla Home</a>
                    <a href="profilo.html" class="btn-layout-light">I miei Noleggi</a>

    [FOOTER]

    <script src="../js/script.js"></script>
