  <header>
    <div class="header-container">

        <div class="logo">

            <img alt="Logo SailUP"
              src="https://images.unsplash.com/photo-1569263979104-865ab7cd8d13?auto=format&fit=crop&w=400&q=80"
              width="30">
          </picture>
          <span class="logo-text" lang="en">Sail<span class="text-accent">UP</span></span>

        <nav id="main-menu">
