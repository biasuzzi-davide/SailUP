    [HEADER]

    <div class="sr-only" id="breadcrumb-label">
        <span lang="en">Breadcrumb</span>

            <li aria-current="page">Pagamento</li>
        </ol>
    </nav>

    <main id="main-content">
        <section class="section-container">
            <div class="auth-card">
                <h1>Completa la Prenotazione</h1>
                <p class="auth-subtitle">Inserisci i dati della carta per procedere</p>

                <div id="error-message" class="error-message hidden" role="alert" aria-live="assertive"></div>
                <div id="success-message" class="success-message hidden" role="alert" aria-live="polite"></div>

                <form id="payment-form" action="pagamento.php" method="post">
                    <fieldset>
                        <legend>Dati Carta di Credito</legend>

                        <div class="form-group">
                            <label for="card-holder">Intestatario Carta</label>
                            <input type="text" id="card-holder" name="card_holder" required autocomplete="cc-name" placeholder="Mario Rossi">
                            <span id="card-holder-error" class="field-error" aria-live="polite"></span>
                        </div>

                        <div class="form-group">
                            <label for="card-number">Numero Carta</label>
                            <input type="text" id="card-number" name="card_number" required autocomplete="cc-number" maxlength="19" inputmode="numeric" placeholder="1234 5678 9012 3456">
                            <span id="card-number-error" class="field-error" aria-live="polite"></span>
                        </div>

                        <div class="form-row">
                            <div class="form-group">
                                <label for="expiry-date">Scadenza</label>
                                <input type="text" id="expiry-date" name="expiry_date" required autocomplete="cc-exp" placeholder="MM/AA" maxlength="5" inputmode="numeric">
                                <span id="expiry-date-error" class="field-error" aria-live="polite"></span>
                            </div>

                            <div class="form-group">
                                <label for="cvv"><abbr title="Card Verification Value" lang="en">CVV</abbr></label>
                                <input type="text" id="cvv" name="cvv" required autocomplete="cc-csc" maxlength="4" inputmode="numeric" placeholder="123">
                                <span id="cvv-error" class="field-error" aria-live="polite"></span>
                            </div>
                        </div>
                    </fieldset>

                    <div class="checkbox-group">
                        <input type="checkbox" id="terms" name="terms" required>
                        <label for="terms">Accetto i <a href="privacy.php" target="_blank" rel="noopener noreferrer">termini e condizioni</a></label>
                    </div>
                    <span id="terms-error" class="field-error" role="alert"></span>

                    <div class="form-actions">
                        <a href="[LINK_INDIETRO]" class="btn-layout-light">Indietro</a>
                        <button type="submit" class="btn-layout">Paga Ora</button>
                    </div>
                </form>
            </div>
        </section>
    </main>
